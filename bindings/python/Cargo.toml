[package]
name = "pyroncalc"
version = "0.5.0"
edition = "2021"


[lib]
name = "ironcalc"
crate-type = ["cdylib"]


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xlsx = { package= "ironcalc", path = "../../xlsx", version = "0.5.0" }
pyo3 = { version = "0.23", features = ["extension-module", "chrono"] }
polars = { version = "0.46.0", optional = true }
chrono = "0.4.40"


[features]
extension-module = ["pyo3/extension-module"]
polars = ["dep:polars"]
default = ["extension-module"]
