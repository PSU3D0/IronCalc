name: Build Dev Wheels

on:
  push:
    branches:
      - python-eval-support

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        architecture: [x86_64, aarch64]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.architecture == 'aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
          components: rustfmt, clippy

      - name: Setup QEMU
        if: matrix.architecture == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Set target
        id: target
        run: |
          if [ "${{ matrix.architecture }}" == "aarch64" ]; then
            echo "target=aarch64-unknown-linux-gnu" >> $GITHUB_OUTPUT
          else
            echo "target=x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ steps.target.outputs.target }}
          args: >
            --release
            --manifest-path bindings/python/Cargo.toml
            --out dist
            -i python${{ matrix.python-version }}
            --zig
          manylinux: ${{ matrix.architecture == 'aarch64' && '2_24' || 'auto' }}
          maturin-version: 1.8.3
          working-directory: .

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30

  # Optional: Combine all wheels into a single artifact
  combine_wheels:
    name: Combine all wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v3
        with:
          path: all-wheels

      - name: Combine wheels
        run: |
          mkdir -p combined-wheels
          find all-wheels -name "*.whl" -exec cp {} combined-wheels/ \;

      - name: Upload combined wheels
        uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: combined-wheels/*.whl
          retention-days: 7